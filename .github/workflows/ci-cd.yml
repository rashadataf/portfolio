# CI/CD Pipeline for VPS-hosted Portfolio
#
# Flow:
#   1. Push to any branch → CI runs (lint, typecheck, unit tests, build)
#   2. Merge to main → CI runs + Docker image built & pushed to GHCR
#   3. Create tag (v1.0.0) → CI runs + image pushed + deploy to VPS via self-hosted runner
#
# The VPS has a self-hosted GitHub Actions runner installed.
# Pulumi state lives in Pulumi Cloud (app.pulumi.com) — authenticated via a
# non-expiring PULUMI_ACCESS_TOKEN (GitHub secret), so no interactive login.
# Stack secrets live in Pulumi.prod.yaml (encrypted, committed to repo).

name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.18.0'

permissions:
  contents: write   # for GitHub Releases
  packages: write   # for GHCR

jobs:
  # ============================================================
  # CI: Lint + Type Check (runs on every push/PR)
  # ============================================================
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: app/yarn.lock

      - run: cd app && yarn install --frozen-lockfile
      - run: cd app && yarn lint
      - run: cd app && yarn type-check

  # ============================================================
  # CI: Unit Tests (runs on every push/PR)
  # ============================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: portfolio_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/portfolio_test
      NODE_ENV: test
      AUTH_SECRET: test-secret-at-least-32-characters-long
      AUTH_TRUST_HOST: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: app/yarn.lock

      - run: cd app && yarn install --frozen-lockfile
      - run: cd app && yarn test --ci --coverage

      - uses: codecov/codecov-action@v4
        with:
          files: app/coverage/lcov.info
          flags: unit
          fail_ci_if_error: false

  # ============================================================
  # CI: Build (runs on every push/PR)
  # ============================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-and-typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: app/yarn.lock

      - run: cd app && yarn install --frozen-lockfile
      - run: cd app && yarn build
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          AUTH_SECRET: test-secret-at-least-32-characters-long

  # ============================================================
  # CD: Build & Push Docker Image to GHCR (main + tags only)
  # ============================================================
  docker-publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/portfolio
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PORTFOLIO_WORKDIR_PATH=/portfolio/app

  # ============================================================
  # CD: Deploy to VPS (on version tag only)
  # ============================================================
  # Runs on the self-hosted runner installed on your VPS.
  # Pulumi state lives in Pulumi Cloud — auth via PULUMI_ACCESS_TOKEN secret.
  # Stack secrets are in Pulumi.prod.yaml (encrypted, committed to repo).
  # The runner needs: docker, pulumi CLI, access to /var/run/docker.sock
  deploy:
    name: Deploy to VPS
    # Use only DEFAULT labels (every self-hosted Linux runner has these).
    # Custom labels like "vps" only match if the runner was configured with
    # `--labels vps` — otherwise the job waits forever for a match.
    runs-on: [self-hosted, linux]
    timeout-minutes: 25
    needs: [docker-publish]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull latest image
        run: docker pull ghcr.io/${{ github.repository }}/portfolio:latest

      - name: Deploy with Pulumi
        working-directory: ./infra
        env:
          # Non-expiring access token from app.pulumi.com/account/tokens.
          # Without it, pulumi prompts for interactive browser login,
          # which is impossible in CI. Create the token once, store it here.
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          # Only needed if your `secure:` config values were encrypted with a
          # passphrase. If you always used Pulumi Cloud's default stack-managed
          # encryption, delete this line.
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: |
          # State lives in Pulumi Cloud (the default backend) — the same
          # place your manual `pulumi` commands on the VPS use. No backend
          # URL needed. whoami fails fast if the token is bad/expired.
          pulumi whoami

          # Select the prod stack. Do NOT auto-init: a fresh empty stack would
          # make `pulumi up` try to CREATE every resource from scratch.
          pulumi stack select prod

          # Update the image tag to the version being deployed
          pulumi config set PORTFOLIO_IMAGE_TAG ${{ github.ref_name }}

          # Preview first (shows what will change)
          pulumi preview

          # Apply changes
          pulumi up --yes

      - name: Verify deployment
        run: |
          sleep 15
          # Check via Traefik (internal Docker network)
          curl -sf http://localhost/api/health || \
          curl -sf https://rashadataf.com/api/health || \
          exit 1

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
