# CI/CD Pipeline for VPS-hosted Portfolio
#
# Flow:
#   1. Push to any branch → CI runs (lint, typecheck, unit tests, build)
#   2. Merge to main → CI runs + Docker image built & pushed to GHCR
#   3. Create tag (v1.0.0) → CI runs + image pushed + deploy to VPS via self-hosted runner
#
# The VPS has a self-hosted GitHub Actions runner installed.
# Pulumi state lives in Pulumi Cloud (app.pulumi.com) — authenticated via a
# non-expiring PULUMI_ACCESS_TOKEN (GitHub secret), so no interactive login.
# Stack secrets live in Pulumi.prod.yaml (encrypted, committed to repo).

name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.18.0'

permissions:
  contents: write   # for GitHub Releases
  packages: write   # for GHCR

jobs:
  # ============================================================
  # CI: Lint + Type Check (runs on every push/PR)
  # ============================================================
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: app/yarn.lock

      - run: cd app && yarn install --frozen-lockfile
      - run: cd app && yarn lint
      - run: cd app && yarn type-check

  # ============================================================
  # CI: Unit Tests (runs on every push/PR)
  # ============================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: portfolio_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/portfolio_test
      NODE_ENV: test
      AUTH_SECRET: test-secret-at-least-32-characters-long
      AUTH_TRUST_HOST: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: app/yarn.lock

      - run: cd app && yarn install --frozen-lockfile
      - run: cd app && yarn test --ci --coverage

      - uses: codecov/codecov-action@v7
        with:
          files: app/coverage/lcov.info
          flags: unit
          fail_ci_if_error: false

  # ============================================================
  # CI: Build (runs on every push/PR)
  # ============================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-and-typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: app/yarn.lock

      - run: cd app && yarn install --frozen-lockfile
      - run: cd app && yarn build
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          AUTH_SECRET: test-secret-at-least-32-characters-long

  # ============================================================
  # CI: End-to-end tests (runs on every push/PR)
  # ============================================================
  # The e2e specs already existed but nothing ran them. Chromium only —
  # the config declares 5 browser projects, which is useful locally but
  # five times the CI minutes for the same regressions.
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-and-typecheck]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: portfolio_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # The app runs its own migrations on boot (migration.service.ts), so an
      # empty database is all this needs.
      DATABASE_URL: postgresql://test:test@localhost:5432/portfolio_e2e
      AUTH_SECRET: test-secret-at-least-32-characters-long
      AUTH_TRUST_HOST: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: app/yarn.lock

      - run: cd app && yarn install --frozen-lockfile
      - run: cd app && npx playwright install --with-deps chromium
      - run: cd app && yarn test:e2e --project=chromium

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7

  # ============================================================
  # CD: Build & Push Docker Image to GHCR (main + tags only)
  # ============================================================
  docker-publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, e2e-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    outputs:
      # Consumed by the deploy job so Pulumi can tell "same tag, new image"
      # apart from "nothing changed".
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/portfolio
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ./app
          file: ./app/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PORTFOLIO_WORKDIR_PATH=/portfolio/app

  # ============================================================
  # CD: Deploy to VPS (on version tag only)
  # ============================================================
  # Runs on the self-hosted runner installed on your VPS.
  # Pulumi state lives in Pulumi Cloud — auth via PULUMI_ACCESS_TOKEN secret.
  # Stack secrets are in Pulumi.prod.yaml (encrypted, committed to repo).
  # The runner needs: docker, pulumi CLI, access to /var/run/docker.sock
  deploy:
    name: Deploy to VPS
    # Use only DEFAULT labels (every self-hosted Linux runner has these).
    # Custom labels like "vps" only match if the runner was configured with
    # `--labels vps` — otherwise the job waits forever for a match.
    runs-on: [self-hosted, linux]
    timeout-minutes: 25
    needs: [docker-publish]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Free disk space before deploying — the VPS is small and past deploys
      # filled it with image layers (ENOSPC during yarn install).
      #
      # Deliberately NOT `docker system prune -af` / `docker builder prune -af`.
      # Those wipe every cached layer, so the next pull re-downloads the whole
      # image; back when the VPS still compiled the app they also forced a cold
      # ~12-minute Next.js build that got OOM-killed. Dangling layers and images
      # older than a week are enough to keep disk in check.
      - name: Clean up disk space
        run: |
          df -h /
          docker image prune -f --filter "until=168h" || true
          docker container prune -f || true
          df -h /

      - name: Deploy with Pulumi
        working-directory: ./infra
        env:
          # Non-expiring access token from app.pulumi.com/account/tokens.
          # Without it, pulumi prompts for interactive browser login,
          # which is impossible in CI. Create the token once, store it here.
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          # Only needed if your `secure:` config values were encrypted with a
          # passphrase. If you always used Pulumi Cloud's default stack-managed
          # encryption, delete this line.
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: |
          # State lives in Pulumi Cloud (the default backend) — the same
          # place your manual `pulumi` commands on the VPS use. No backend
          # URL needed. whoami fails fast if the token is bad/expired.
          pulumi whoami

          # Select the prod stack. Do NOT auto-init: a fresh empty stack would
          # make `pulumi up` try to CREATE every resource from scratch.
          pulumi stack select prod

          # Update the image tag to the version being deployed. The prod stack
          # sets PORTFOLIO_IMAGE_SOURCE=1, so Pulumi pulls
          # ghcr.io/<repo>/portfolio:<tag> — the image docker-publish built a
          # few minutes ago — instead of compiling Next.js on this box.
          pulumi config set PORTFOLIO_IMAGE_TAG ${{ github.ref_name }}

          # Re-pushing an existing tag leaves PORTFOLIO_IMAGE_TAG unchanged, so
          # without the digest Pulumi would see no diff and keep the stale
          # container running.
          pulumi config set PORTFOLIO_IMAGE_DIGEST "${{ needs.docker-publish.outputs.digest }}"

          # Preview first (shows what will change)
          pulumi preview

          # Apply changes
          pulumi up --yes

      - name: Verify deployment
        run: |
          # Wait for the app to boot — Next.js needs time to start, connect to
          # Postgres, and run migrations. Retry every 5s for up to 2 minutes.
          echo "Waiting for app to become healthy..."
          for i in $(seq 1 24); do
            if curl -sf http://localhost/api/health 2>/dev/null || \
               curl -sf https://rashadataf.com/api/health 2>/dev/null; then
              echo "App is healthy after $((i * 5)) seconds"
              exit 0
            fi
            echo "Attempt $i/24 — not ready yet, waiting 5s..."
            sleep 5
          done
          echo "App did not become healthy within 2 minutes"
          # Print container logs for debugging before failing
          docker logs portfolio-infra-portfolio-prod --tail 50 || true
          exit 1

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
